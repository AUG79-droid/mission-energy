name: Review precise technical image titles
on:
  push:
    branches: [fix/editorial-photo-review]
    paths: ['editorial-specific.json','scripts/editorial-photo-specific.py','.github/workflows/editorial-specific.yml']
permissions:
  contents: write
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python scripts/editorial-photo-specific.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial-review
          git commit -m "Prepare contact sheets for individual visual review"
          git push origin HEAD:fix/editorial-photo-review
